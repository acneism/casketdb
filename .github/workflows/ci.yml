name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - if: matrix.os == 'macos-latest'
        run: go test -timeout 15m ./...
      - if: matrix.os == 'windows-latest'
        run: go test -p 1 -timeout 20m ./...
        env:
          CASKETDB_TEST_ELECTION_TICKS: "2000"
      - if: matrix.os == 'ubuntu-latest'
        name: go test with coverage
        run: |
          set -o pipefail
          go test -timeout 15m -cover ./... | tee test.out
          { echo "| Package | Coverage |"; echo "| --- | ---: |"; } >> "$GITHUB_STEP_SUMMARY"
          awk '$1 == "ok" && $4 == "coverage:" {
            cov = $5 + 0
            printf "| `%s` | %.1f%% |\n", $2, cov >> ENVIRON["GITHUB_STEP_SUMMARY"]
            if ($2 ~ /internal\/(bitcask|replica|server)$/ && cov < 80) {
              printf "%s: coverage %.1f%% is below 80%%\n", $2, cov
              bad = 1
            }
          } END { exit bad }' test.out

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 20m ./...

  differential:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^TestDifferential$' -count=1 -v ./internal/server
        env:
          CASKETDB_REDIS_ADDR: localhost:6379

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^FuzzReadCommand$' -fuzztime 60s ./internal/resp
      - run: go test -run '^$' -fuzz '^FuzzACLRules$' -fuzztime 30s ./internal/server
      - run: go test -run '^$' -fuzz '^FuzzScanner$' -fuzztime 30s ./internal/bitcask
      - run: go test -run '^$' -fuzz '^FuzzEntry$' -fuzztime 30s ./internal/replica
      - run: go test -run '^$' -fuzz '^FuzzSnapshotInfo$' -fuzztime 30s ./internal/replica
